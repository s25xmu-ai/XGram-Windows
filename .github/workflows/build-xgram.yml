# Build XGram — Unigram (WinUI 3) rebranded as XGram, unpackaged .exe build.
#
# What this does, in order:
#   1. Checks out the repo recursively (submodules: tdlib, tgcalls, libwebp, ...).
#   2. Sets up a pinned vcpkg next to the checkout (baseline from vcpkg.json).
#   3. Generates Telegram/Constants.Secret.cs from repository secrets.
#      Required secrets (Settings > Secrets and variables > Actions):
#        TELEGRAM_API_ID   — integer ApiId from https://my.telegram.org/apps
#        TELEGRAM_API_HASH — ApiHash from the same page
#      Without them the build cannot even start: the file is git-ignored
#      and the project does not compile without it.
#      ApiId/ApiHash can also be given as workflow_dispatch inputs at run
#      time (inputs win over secrets). WARNING: inputs are visible in the
#      workflow-run history to anyone with repo access; ApiHash is a secret,
#      so prefer the secret unless you are running a one-off test build.
#
#      Datacenter / RSA: Unigram itself has NO setting for a DC IP, port or
#      RSA key. ApiId/ApiHash are the only Telegram credentials in Unigram
#      (Telegram/Constants.Secret.cs -> SetTdlibParameters). The DC list and
#      the server RSA keys are hardcoded inside TDLib (Libraries/tdlib,
#      PublicRsaKeyShared.cpp / Config.cpp), and TDLib fetches the live DC
#      list from Telegram after first contact with DC1. This workflow
#      therefore ACCEPTS dc_ip/dc_port/rsa_* as build-time inputs, validates
#      them, and records them in xgram-build-config.json — but it does NOT
#      silently re-point TDLib at another server. Allowed dc_ip values are
#      Telegram's official/test DC IPs, plus one explicit custom DC supplied
#      by the repo owner and verified in this file's history:
#        193.151.158.60 (Tehran, AS60077 Asiatech), RSA fingerprint
#        0x9092a605d9189818 (-8029172641600858088), verified against the
#        supplied RSA public key (SHA1 of TL-serialized n+e, low 64 bits).
#      Any other non-Telegram IP still FAILS the workflow.
#
#      Custom DC patch (TDLib 4c6377aa, the submodule pinned in this repo):
#      the workflow step "Patch TDLib for custom DC" applies it, build-time
#      only, before the tdjson build, and only when dc_ip is the custom DC:
#        1. Libraries/tdlib/td/telegram/net/ConnectionCreator.cpp,
#           get_default_dc_options(): production DC2
#             add_ip_ports(2, {"149.154.167.51", "95.161.76.100"}, ports)
#           becomes
#             add_ip_ports(2, {"193.151.158.60"}, {2398})
#           (ports 443/80/5222 are NOT used for the custom DC.)
#        2. Libraries/tdlib/td/telegram/net/PublicRsaKeySharedMain.cpp,
#           PublicRsaKeySharedMain::create(false): the owner's RSA PEM is
#           added as a second key next to Telegram's main key, so a server
#           presenting fingerprint 0x9092a605d9189818 is accepted.
#           (get_rsa_key() otherwise fails with "Unknown Main fingerprints".)
#      Limits, read before using a custom-DC build:
#        - ConfigManager still fetches SimpleConfig / FullConfig from
#          Telegram, which can re-add official DC2 options. The custom DC
#          is therefore the DC2 default, not a guarantee that no official
#          DC is ever tried. If the custom server is a full MTProto server,
#          its own config should list the custom DC; if it is a forwarder
#          to Telegram, other DCs will still go to Telegram.
#        - A server at a custom DC would see phone numbers, login codes and
#          messages for anyone who logs in through that build.
#   4. Rebrands, build-time only (nothing is committed back):
#        - Package display name: Unigram WinUI -> XGram
#        - Package identity:     38833FF26BA1D.UnigramWinUI -> 38833FF26BA1D.XGramWinUI
#        - Protocol / alias / file-type suffix: winui -> xgram
#          (tg-xgram:, Telegram-xgram.exe alias, .unigram-theme-xgram)
#        - Assembly title / product and the app's display-name resource:
#          Unigram -> XGram
#      The binary on disk intentionally stays Telegram.exe: the unpackaged
#      updater (Telegram/Services/UnpackagedUpdates.cs) requires the shipped
#      zip to contain Telegram.exe and Updater.exe, and the WebView2 profile
#      is hard-coded as "Telegram.exe.WebView2". The workflow also drops a
#      copy named XGram.exe next to it in the uploaded folder as a launch
#      alias; the zip itself is left untouched so its manifest.json stays
#      valid for in-app updates.
#   5. Builds TDLib for the desktop triplet (x64-windows / arm64-windows).
#   6. Runs ./Build.WinUI.ps1 -Unpackaged, which publishes a self-contained
#      folder (Telegram.exe + DLLs + CRT + Updater.exe) and zips it as
#      Telegram-<version>-<arch>.zip with a manifest.json inside.
#   7. Renames the zip to XGram-<version>-<arch>.zip and uploads the folder
#      and the zip as a workflow artifact.
#
# Runner: windows-2025-vs2026 — the GitHub-hosted x64 image with
# Visual Studio 2026. Unigram's build instructions require VS 2026,
# Windows 11 SDK 10.0.26100.0, .NET 10, CMake 4.4+ and PHP.
# Expect a long build: TDLib + vcpkg + NativeAOT link take tens of minutes,
# often 1-2 hours on a first (cold-cache) run.
name: Build XGram (WinUI unpackaged exe)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        type: choice
        options: [x64, ARM64]
        default: x64
      version:
        description: "Version (4 parts, e.g. 13.1.3.0). Leave empty to use Telegram.Msix/Package.appxmanifest."
        type: string
        default: ""
      api_id:
        description: "Telegram ApiId (my.telegram.org). Leave empty to use secret TELEGRAM_API_ID."
        type: string
        default: ""
      api_hash:
        description: "Telegram ApiHash. Leave empty to use secret TELEGRAM_API_HASH. Prefer the secret: inputs are visible in run history."
        type: string
        default: ""
      use_test_dc:
        description: "Use Telegram test DCs instead of production DCs (SetTdlibParameters useTestDc)"
        type: boolean
        default: false
      dc_id:
        description: "Main datacenter id (1-5 production, 1-3 test). For the custom DC, use 2."
        type: string
        default: "2"
      dc_ip:
        description: "Main datacenter IP. Default is the owner's server 193.151.158.60 (DC2, port 2398). Use 149.154.167.51 for Telegram DC2."
        type: string
        default: "193.151.158.60"
      dc_port:
        description: "Main datacenter port. Default 2398 for the owner's server; 443 for Telegram DCs."
        type: string
        default: "2398"
      rsa_public_key:
        description: "RSA public key for the DC (PEM or base64, single line). Leave empty to use TDLib's built-in Telegram keys."
        type: string
        default: ""
      rsa_fingerprint:
        description: "RSA public key fingerprint (16 hex chars, low 64 bits of SHA1 of the key). Default is the owner's key 9092a605d9189818."
        type: string
        default: "9092a605d9189818"
      create_release:
        description: "Also create a GitHub Release with the zip attached"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VCPKG_BASELINE: c3867e714dd3a51c272826eea77267876517ed99

jobs:
  build:
    name: Build XGram ${{ inputs.arch }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath
          dotnet --info | Select-Object -First 20
          cmake --version
          php --version

      - name: Ensure Visual Studio components (.vsconfig)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $vs = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'No Visual Studio installation with MSBuild was found.' }
          Write-Host "Visual Studio: $vs"
          & (Join-Path $installer 'vs_installer.exe') modify --installPath "$vs" --config '.vsconfig' --quiet --norestart
          if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed with exit code $LASTEXITCODE." }

      - name: Set up pinned vcpkg (sibling of the checkout)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'vcpkg'
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          git -C $vcpkgRoot fetch --tags
          git -C $vcpkgRoot checkout $env:VCPKG_BASELINE
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat')
          if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed with exit code $LASTEXITCODE." }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VCPKG_ROOT=$vcpkgRoot"

      - name: Install Inno Setup 6 (optional, for the installer exe)
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            winget install --id JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements
          } else {
            Write-Host 'Inno Setup already installed.'
          }

      - name: Resolve Telegram config (inputs win over secrets)
        shell: pwsh
        env:
          INPUT_API_ID: ${{ inputs.api_id }}
          INPUT_API_HASH: ${{ inputs.api_hash }}
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          INPUT_DC_ID: ${{ inputs.dc_id }}
          INPUT_DC_IP: ${{ inputs.dc_ip }}
          INPUT_DC_PORT: ${{ inputs.dc_port }}
          INPUT_RSA_FP: ${{ inputs.rsa_fingerprint }}
          INPUT_RSA_KEY: ${{ inputs.rsa_public_key }}
          INPUT_USE_TEST_DC: ${{ inputs.use_test_dc }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apiIdText = $env:INPUT_API_ID
          if ([string]::IsNullOrWhiteSpace($apiIdText)) { $apiIdText = $env:SECRET_API_ID }
          $apiHash = $env:INPUT_API_HASH
          if ([string]::IsNullOrWhiteSpace($apiHash)) { $apiHash = $env:SECRET_API_HASH }
          if ([string]::IsNullOrWhiteSpace($apiIdText) -or [string]::IsNullOrWhiteSpace($apiHash)) {
            throw 'Missing Telegram credentials: set ApiId/ApiHash as workflow inputs, or set TELEGRAM_API_ID and TELEGRAM_API_HASH in Settings > Secrets and variables > Actions (from https://my.telegram.org/apps).'
          }
          $apiId = 0
          if (-not [int]::TryParse($apiIdText, [ref]$apiId)) {
            throw 'ApiId must be an integer.'
          }
          # --- Datacenter validation ---
          # Telegram production DCs (help.getConfig / core.telegram.org/api/datacenter):
          # DC1 149.154.175.50, DC2 149.154.167.51 / 95.161.76.100, DC3 149.154.175.100,
          # DC4 149.154.167.91, DC5 149.154.171.5; test DCs 149.154.175.10, 149.154.167.40, 149.154.175.117.
          # (from TDLib 4c6377aa, ConnectionCreator::get_default_dc_options)
          $officialDcIps = @('149.154.175.50', '149.154.167.51', '95.161.76.100', '149.154.175.100', '149.154.167.91', '149.154.171.5', '149.154.175.10', '149.154.167.40', '149.154.175.117')
          # Explicit custom-DC exception, verified by the repo owner:
          # 193.151.158.60, Tehran / AS60077 Asiatech, RSA fingerprint 0x9092a605d9189818.
          $allowedDcIps = $officialDcIps + @('193.151.158.60')
          $dcIp = $env:INPUT_DC_IP
          $dcPort = 0
          if (-not [int]::TryParse($env:INPUT_DC_PORT, [ref]$dcPort) -or $dcPort -lt 1 -or $dcPort -gt 65535) {
            throw "dc_port must be 1-65535, got '$($env:INPUT_DC_PORT)'."
          }
          if ($dcIp -notin $allowedDcIps) {
            throw "dc_ip '$dcIp' is not an allowed DC IP ($($allowedDcIps -join ', ')). TDLib hardcodes its DC list and RSA keys; re-pointing the client at another server needs a reviewed TDLib patch and means that server would see logins. Stop here instead of building a client that silently talks to the wrong server."
          }
          if ($dcIp -eq '193.151.158.60') {
            Write-Warning 'Custom DC 193.151.158.60: this build is recorded as talking to a non-Telegram server in Tehran (AS60077). TDLib still needs a reviewed patch to actually connect there; the workflow alone does not re-point it.'
          }
          $dcId = 0
          if (-not [int]::TryParse($env:INPUT_DC_ID, [ref]$dcId) -or $dcId -lt 1 -or $dcId -gt 5) {
            throw "dc_id must be 1-5, got '$($env:INPUT_DC_ID)'."
          }
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RSA_FP) -and $env:INPUT_RSA_FP -notmatch '^(0x)?[0-9a-fA-F]{16}$') {
            throw "rsa_fingerprint must be 16 hex chars (low 64 bits of SHA1 of the RSA key), got '$($env:INPUT_RSA_FP)'."
          }
          # Verify the fingerprint actually belongs to the supplied RSA key:
          # fingerprint = low 64 bits (little-endian) of SHA1(TL-serialized n+e),
          # where n/e are TL strings. Mismatch = wrong key, wrong fingerprint, or both.
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RSA_KEY) -and -not [string]::IsNullOrWhiteSpace($env:INPUT_RSA_FP)) {
            $rsa = [System.Security.Cryptography.RSA]::Create()
            $pem = $env:INPUT_RSA_KEY.Trim()
            $rsa.ImportRSAPublicKey([System.Convert]::FromBase64String(($pem -replace '-----BEGIN RSA PUBLIC KEY-----','' -replace '-----END RSA PUBLIC KEY-----','' -replace '\s','')), [ref]$null)
            $params = $rsa.ExportParameters($false)
            $n = $params.Modulus; $e = $params.Exponent
            $tl = [System.Collections.Generic.List[byte]]::new()
            # TL string: n is 256 bytes, so 0xFE + 3-byte LE length + data (no padding, 256 % 4 == 0)
            $tl.Add(0xFE); $tl.AddRange([byte[]]([System.BitConverter]::GetBytes($n.Length)[0..2])); $tl.AddRange($n)
            # TL string: e is short, 1-byte length + data, padded to 4 bytes total
            $tl.Add([byte]$e.Length); $tl.AddRange($e)
            while ($tl.Count % 4 -ne 0) { $tl.Add(0) }
            # Note: the two TL strings above are appended in order n then e; the
            # padding loop above applies to the whole buffer only if needed — the
            # e-string itself is already 4 bytes, so this is a no-op in practice.
            $sha1 = [System.Security.Cryptography.SHA1]::Create().ComputeHash($tl.ToArray())
            $computed = [System.BitConverter]::ToString([byte[]]$sha1[-8..-1]).Replace('-','').ToLowerInvariant()
            # SHA1 low 64 bits are stored little-endian in Telegram fingerprints:
            # reverse the last 8 bytes to compare with the hex fingerprint as given.
            $computedLe = -join ($sha1[-1..-8] | ForEach-Object { $_.ToString('x2') })
            $given = ($env:INPUT_RSA_FP -replace '^0x','').ToLowerInvariant()
            if ($computedLe -ne $given) {
              throw "rsa_fingerprint '$given' does not match the supplied RSA public key (computed $computedLe). Check the key and the fingerprint."
            }
            Write-Host "RSA fingerprint verified: $computedLe"
          }
          # Record the resolved config (secrets masked) for the build artifact.
          $config = [ordered]@{
            api_id = $apiId
            api_hash_present = -not [string]::IsNullOrWhiteSpace($apiHash)
            api_hash_from = if ([string]::IsNullOrWhiteSpace($env:INPUT_API_HASH)) { 'secret' } else { 'workflow input' }
            use_test_dc = ($env:INPUT_USE_TEST_DC -eq 'true')
            dc_id = $dcId
            dc_ip = $dcIp
            dc_port = $dcPort
            rsa_public_key_present = -not [string]::IsNullOrWhiteSpace('${{ inputs.rsa_public_key }}')
            rsa_fingerprint = $env:INPUT_RSA_FP
          }
          ($config | ConvertTo-Json) | Out-File -FilePath 'xgram-build-config.json' -Encoding utf8
          "XGRAM_API_ID=$apiId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # ApiHash only via a masked env file for the next step; never echo it.
          $apiHash | Out-File -FilePath 'xgram-api-hash.txt' -Encoding utf8 -NoNewline
          Write-Host "ApiId=$apiId, DC=$dcId $dcIp`:$dcPort, use_test_dc=$($env:INPUT_USE_TEST_DC), rsa_fingerprint='$($env:INPUT_RSA_FP)'"
          $apiHash = Get-Content 'xgram-api-hash.txt' -Raw
          $secret = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = $apiId;
                      ApiHash = "$apiHash";
                      AppChannel = "";
                      AppReportsId = "";
                      AppCenterId = "";
                      BuildNumber = 0;
                      TextRecognizerModelKey = "";
                      UnpackagedUpdatesChatId = 0;
                  }
              }
          }
          "@
          $secret | Out-File -FilePath 'Telegram/Constants.Secret.cs' -Encoding utf8
          Write-Host 'Wrote Telegram/Constants.Secret.cs (ApiId present, ApiHash hidden).'

      - name: Apply use_test_dc (build-time only, if requested)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.use_test_dc }}' -eq 'true') {
            $path = 'Telegram/Services/ClientService.cs'
            $text = Get-Content $path -Raw
            if ($text -notmatch 'useTestDc: _settings.UseTestDC') {
              throw 'ClientService.cs no longer contains "useTestDc: _settings.UseTestDC" — the test-DC patch does not apply to this revision.'
            }
            Set-Content $path ($text.Replace('useTestDc: _settings.UseTestDC', 'useTestDc: true')) -NoNewline
            Write-Host 'Forced useTestDc: true for this build.'
          } else {
            Write-Host 'Production DCs (useTestDc left as the app setting).'
          }

      - name: Save RSA public key (if provided)
        shell: pwsh
        env:
          INPUT_RSA_KEY: ${{ inputs.rsa_public_key }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RSA_KEY)) {
            $env:INPUT_RSA_KEY | Out-File -FilePath 'xgram-rsa-public-key.txt' -Encoding utf8 -NoNewline
            Write-Host 'Saved RSA public key to xgram-rsa-public-key.txt (public key only, no private key).'
            Write-Host 'NOTE: this key is recorded only. TDLib uses its built-in Telegram keys; using a different key requires a TDLib patch.'
          } else {
            Write-Host 'No RSA public key provided; using TDLib built-in Telegram keys.'
          }

      - name: Rebrand Unigram -> XGram (build-time only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # MSBuild defaults in Telegram/Telegram.WinUI.csproj. The patch target
          # (PatchWinUIAppxManifest) copies these into the generated manifest.
          $csproj = 'Telegram/Telegram.WinUI.csproj'
          $text = Get-Content $csproj -Raw
          $text = $text.Replace('38833FF26BA1D.UnigramWinUIBundle', '38833FF26BA1D.XGramWinUIBundle')
          $text = $text.Replace('38833FF26BA1D.UnigramWinUI', '38833FF26BA1D.XGramWinUI')
          $text = $text.Replace('Unigram WinUI (bundle)', 'XGram (bundle)')
          $text = $text.Replace('Unigram WinUI', 'XGram')
          $text = $text.Replace('>winui-bundle<', '>xgram-bundle<')
          $text = $text.Replace('>winui<', '>xgram<')
          Set-Content $csproj $text -NoNewline
          # Assembly title / product (Task Manager, file properties).
          $assemblyInfo = 'Telegram/Properties/AssemblyInfo.cs'
          $text = Get-Content $assemblyInfo -Raw
          $text = $text.Replace('AssemblyTitle("Unigram")', 'AssemblyTitle("XGram")')
          $text = $text.Replace('AssemblyProduct("Unigram")', 'AssemblyProduct("XGram")')
          Set-Content $assemblyInfo $text -NoNewline
          # App display name in every language's Resources.resw, and the
          # user-visible strings in the English Resources.xml.
          Get-ChildItem 'Telegram/Strings/*/Resources.resw' | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<value>Unigram</value>') {
              Set-Content $_.FullName ($content.Replace('<value>Unigram</value>', '<value>XGram</value>')) -NoNewline
            }
          }
          $enXml = 'Telegram/Strings/en/Resources.xml'
          if (Test-Path $enXml) {
            $content = Get-Content $enXml -Raw
            Set-Content $enXml ($content.Replace('Unigram', 'XGram')) -NoNewline
          }
          Write-Host 'Rebrand check (should show XGram, no Unigram WinUI):'
          Select-String -Path $csproj -Pattern 'XGramWinUI|XGram' | Select-Object -First 5
          if (Select-String -Path $csproj -Pattern 'UnigramWinUI' -Quiet) {
            throw 'Rebrand failed: UnigramWinUI still present in Telegram.WinUI.csproj.'
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$manifest = Get-Content 'Telegram.Msix/Package.appxmanifest' -Raw
            $version = $manifest.Package.Identity.Version
          }
          if (-not ($version -match '^\d+\.\d+\.\d+\.\d+$')) {
            throw "Version must have four parts, got '$version'."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Patch TDLib for custom DC (build-time only)
        shell: pwsh
        env:
          INPUT_DC_ID: ${{ inputs.dc_id }}
          INPUT_DC_IP: ${{ inputs.dc_ip }}
          INPUT_DC_PORT: ${{ inputs.dc_port }}
          INPUT_RSA_KEY: ${{ inputs.rsa_public_key }}
          INPUT_RSA_FP: ${{ inputs.rsa_fingerprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dcIp = $env:INPUT_DC_IP
          $officialDcIps = @('149.154.175.50', '149.154.167.51', '95.161.76.100', '149.154.175.100', '149.154.167.91', '149.154.171.5', '149.154.175.10', '149.154.167.40', '149.154.175.117')
          if ($dcIp -in $officialDcIps) {
            Write-Host "Official DC $dcIp — no TDLib patch needed."
            return
          }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_RSA_KEY)) {
            throw "Custom DC $dcIp needs rsa_public_key: the server's RSA public key (PEM) must be given as a workflow input."
          }
          $dcId = [int]$env:INPUT_DC_ID
          $dcPort = [int]$env:INPUT_DC_PORT
          # 1. ConnectionCreator.cpp — replace the production DC2 entry only.
          $ccPath = 'Libraries/tdlib/td/telegram/net/ConnectionCreator.cpp'
          $cc = Get-Content $ccPath -Raw
          $oldDc2 = 'add_ip_ports(2, {"149.154.167.51", "95.161.76.100"}, ports);'
          if ($cc -notmatch [regex]::Escape($oldDc2)) {
            throw "TDLib patch does not apply: expected DC2 line not found in $ccPath (TDLib version drift?). Line was: $oldDc2"
          }
          # Only patch the production branch: the test branch has no such line.
          $newDc2 = "add_ip_ports($dcId, {`"$dcIp`"}, {$dcPort}); // XGram custom DC$dcId"
          $cc = $cc.Replace($oldDc2, $newDc2)
          Set-Content $ccPath $cc -NoNewline
          if ((Get-Content $ccPath -Raw) -match '149.154.167.51') {
            throw "TDLib patch failed: official DC2 IP 149.154.167.51 is still in $ccPath."
          }
          # 2. PublicRsaKeySharedMain.cpp — add the owner's key next to Telegram's main key.
          $rsaPath = 'Libraries/tdlib/td/telegram/net/PublicRsaKeySharedMain.cpp'
          $rsaCpp = Get-Content $rsaPath -Raw
          $marker = '-----END RSA PUBLIC KEY-----");'
          $idx = $rsaCpp.LastIndexOf($marker)
          if ($idx -lt 0) {
            throw "TDLib patch does not apply: RSA key marker not found in $rsaPath."
          }
          $pemLines = ($env:INPUT_RSA_KEY -split "`n") | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }
          $cppLines = $pemLines | ForEach-Object { "              `"$_\n`"" }
          $insert = "`n      add_pem(keys,`n" + ($cppLines -join "`n") + "); // XGram custom DC key, fingerprint $($env:INPUT_RSA_FP)"
          $rsaCpp = $rsaCpp.Insert($idx + $marker.Length, $insert)
          Set-Content $rsaPath $rsaCpp -NoNewline
          Write-Host "Patched TDLib: DC$dcId -> $dcIp`:$dcPort, RSA key added to PublicRsaKeySharedMain (fingerprint $($env:INPUT_RSA_FP))."
          Write-Host 'Verify with: git -C Libraries/tdlib diff --stat'

      - name: Install gperf (TDLib build dependency)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # TDLib's tdutils/generate CMakeLists requires gperf; it is not
          # on PATH on the GitHub-hosted Windows image. Chocolatey (preinstalled
          # on the runner) has GNU gperf 3.1.
          if (Get-Command gperf -ErrorAction SilentlyContinue) {
            gperf --version | Select-Object -First 1
          } else {
            choco install gperf -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install gperf failed with exit code $LASTEXITCODE." }
            $chocoBin = 'C:\ProgramData\chocolatey\bin'
            if ($env:PATH -notlike "*$chocoBin*") { $env:PATH = "$chocoBin;$env:PATH" }
            # Make gperf visible to later steps (each runs a fresh shell).
            $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            gperf --version | Select-Object -First 1
          }

      - name: Build TDLib (desktop triplet)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ inputs.arch }}'
          # Libraries/tdjson/build.ps1 resolves "../tdlib" and "../.." and
          # does "cd build-*" relative to the CURRENT directory, so it must
          # be run from inside Libraries/tdjson — from the repo root it
          # looks for D:\a\XGram-Windows\tdlib, which does not exist.
          Push-Location 'Libraries/tdjson'
          try {
            powershell -ExecutionPolicy Bypass -File 'build.ps1' -arch $arch -target windows
            if ($LASTEXITCODE -ne 0) { throw "tdjson build failed with exit code $LASTEXITCODE." }
          } finally {
            Pop-Location
          }

      - name: Build XGram (WinUI unpackaged)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ inputs.arch }}'
          $version = '${{ steps.version.outputs.version }}'
          powershell -ExecutionPolicy Bypass -File './Build.WinUI.ps1' -Platform $arch -Unpackaged -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Build.WinUI.ps1 failed with exit code $LASTEXITCODE." }

      - name: Rename outputs to XGram and add XGram.exe launch alias
        id: outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ inputs.arch }}'
          $archLower = $arch.ToLowerInvariant()
          $version = '${{ steps.version.outputs.version }}'
          $outDir = "Telegram/bin/winui-unpackaged/$arch/Release"
          $publish = Join-Path $outDir 'publish'
          if (-not (Test-Path (Join-Path $publish 'Telegram.exe'))) {
            throw "Telegram.exe not found in $publish. The unpackaged publish failed."
          }
          # Launch alias only: the zip keeps Telegram.exe so its manifest.json
          # (checked by the in-app updater) stays valid.
          Copy-Item (Join-Path $publish 'Telegram.exe') (Join-Path $publish 'XGram.exe') -Force
          $zip = Join-Path $outDir "Telegram-$version-$archLower.zip"
          $xgramZip = Join-Path $outDir "XGram-$version-$archLower.zip"
          if (Test-Path $zip) {
            Move-Item $zip $xgramZip -Force
          } else {
            throw "Expected zip not found: $zip"
          }
          $symbols = Join-Path $outDir "Telegram-$version-$archLower-symbols.zip"
          if (Test-Path $symbols) {
            Move-Item $symbols (Join-Path $outDir "XGram-$version-$archLower-symbols.zip") -Force
          }
          "publish_dir=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$xgramZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem $outDir | Format-Table Name, Length -AutoSize
          Write-Host "Publish folder: $publish"
          Write-Host "Zip: $xgramZip"

      - name: Upload XGram build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGram-windows-${{ inputs.arch }}-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.outputs.outputs.publish_dir }}
            ${{ steps.outputs.outputs.zip }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload build config record (secrets masked)
        uses: actions/upload-artifact@v4
        with:
          name: XGram-build-config-${{ steps.version.outputs.version }}
          path: |
            xgram-build-config.json
            xgram-rsa-public-key.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xgram-v${{ steps.version.outputs.version }}
          name: XGram v${{ steps.version.outputs.version }} (Windows ${{ inputs.arch }})
          files: ${{ steps.outputs.outputs.zip }}
          generate_release_notes: true
